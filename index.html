<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حضور الطلاب</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>تسجيل حضور الطلاب</h1>
        </header>

        <main class="main-content">
            <div class="daily-actions">
                <button id="clearAttendanceBtn" class="btn btn-danger"> بدء يوم جديد </button>
            </div>
            <section class="scanner-section">
                <div id="qrReader"></div>
                <div class="input-group">
                    <input type="text" id="studentIdInput" class="student-input" placeholder="أدخل رقم الطالب يدويًا">
                    <button id="scanBtn" class="btn btn-primary">بحث</button>
                </div>
                
                <div id="studentInfo" class="student-info hidden">
                    <div class="student-card">
                        <div class="student-details">
                            <h2 id="studentName">اسم الطالب</h2>
                            <p id="studentId">رقم الطالب: -</p>
                            <p id="studentGroup">المجموعة: -</p>
                            <div class="payment-info" id="paymentInfo">
                                <div class="payment-status" id="paymentStatus">
                                    <span class="payment-label">حالة الدفع لشهر <span id="currentMonthLabel"></span>:</span>
                                    <span class="payment-value" id="paymentStatusText">-</span>
                                </div>
                            </div>
                        </div>
                        <div class="status-badge" id="statusBadge">
                            <span class="status-dot"></span>
                            <span class="status-text">جاهز للتسجيل</span>
                        </div>
                    </div>
                    <div class="action-buttons attendance-actions">
                        <button id="payAndAttendBtn" class="btn btn-success btn-large">💳 دفع وتسجيل حضور</button>
                        <button id="attendanceOnlyBtn" class="btn btn-secondary btn-large">✅ تسجيل حضور فقط</button>
                    </div>
                </div>

                <div id="errorMessage" class="error-message hidden">
                    <span class="error-icon"></span>
                    <span id="errorText"></span>
                </div>
            </section>

        </main>

        <footer class="footer">
            <p>© 2026 نظام تسجيل الحضور - جميع الحقوق محفوظة</p>
        </footer>
    </div>

    <script src="script.js?v=4"></script>
</body>
</html>
